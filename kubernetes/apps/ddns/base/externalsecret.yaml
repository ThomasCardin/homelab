apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ddns-secrets
  namespace: ddns
  annotations:
    # Created before the Deployment that reads it
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault
    kind: ClusterSecretStore
  target:
    name: ddns-secrets
    creationPolicy: Owner
  dataFrom:
    # Every field of secret/ddns becomes a key of the Secret.
    # Expected fields: NOIP_HOSTNAME, CLOUDFLARE_EMAIL, CLOUDFLARE_API_KEY,
    # CLOUDFLARE_A_RECORD_NAME, CLOUDFLARE_ZONE_ID, DISCORD_WEBHOOK
    - extract:
        key: ddns
