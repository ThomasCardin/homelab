apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: immich-postgres-user
  namespace: immich
  annotations:
    # Created before the CNPG cluster that bootstraps from it
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault
    kind: ClusterSecretStore
  target:
    name: immich-postgres-user
    creationPolicy: Owner
    template:
      # CloudNativePG expects a basic-auth secret for the bootstrap owner
      type: kubernetes.io/basic-auth
      metadata:
        labels:
          cnpg.io/reload: "true"
  data:
    - secretKey: username
      remoteRef:
        # Vault path: secret/immich/postgres, field: username
        key: immich/postgres
        property: username
    - secretKey: password
      remoteRef:
        # Vault path: secret/immich/postgres, field: password
        key: immich/postgres
        property: password
