apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: postgres-user-secret
  namespace: gobservability
  annotations:
    # Created before the CNPG cluster that bootstraps from it
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault
    kind: ClusterSecretStore
  target:
    name: postgres-user-secret
    creationPolicy: Owner
    template:
      # CloudNativePG expects a basic-auth secret for the bootstrap owner
      type: kubernetes.io/basic-auth
      metadata:
        labels:
          cnpg.io/reload: "true"
  data:
    - secretKey: username
      remoteRef:
        # Vault path: secret/gobservability/postgres, field: username
        key: gobservability/postgres
        property: username
    - secretKey: password
      remoteRef:
        # Vault path: secret/gobservability/postgres, field: password
        key: gobservability/postgres
        property: password
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: discord-webhook
  namespace: gobservability
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault
    kind: ClusterSecretStore
  target:
    name: discord-webhook
    creationPolicy: Owner
  data:
    - secretKey: webhook_url
      remoteRef:
        # Vault path: secret/gobservability/discord, field: webhook_url
        key: gobservability/discord
        property: webhook_url
