apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ingress-internal-hubble-ui
  namespace: kube-system
  annotations:
    lbipam.cilium.io/ips: 192.168.2.14
    ingress.cilium.io/loadbalancer-mode: dedicated
spec:
  ingressClassName: cilium
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: hubble-ui
                port:
                  number: 80
