apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: vault
  annotations:
    # Applied after the operator, its CRDs and its webhook are ready
    argocd.argoproj.io/sync-wave: "1"
spec:
  provider:
    vault:
      server: http://vault.vault.svc.cluster.local:8200
      # KV v2 engine mounted at secret/ (vault secrets enable -path=secret kv-v2)
      path: secret
      version: v2
      auth:
        kubernetes:
          # Auth method and role created in Vault (vault auth enable kubernetes)
          mountPath: kubernetes
          role: external-secrets
          serviceAccountRef:
            name: external-secrets
            namespace: external-secrets
