apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: velero
  namespace: argocd
  finalizers:
      - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  destination:
    namespace: velero
    server: https://kubernetes.default.svc
  sources:
    - chart: velero
      helm:
        releaseName: velero
        valueFiles:
          - $values/kubernetes/system/velero/helm/values.yaml
      repoURL: https://vmware-tanzu.github.io/helm-charts
      targetRevision: 11.3.1
    - repoURL: https://github.com/ThomasCardin/homelab.git
      targetRevision: HEAD
      ref: values
    - repoURL: https://github.com/ThomasCardin/homelab.git
      path: kubernetes/system/velero/base
      targetRevision: HEAD
  syncPolicy:
    automated:
      selfHeal: true
    syncOptions:
    - CreateNamespace=true
    # The ExternalSecret is applied once the External Secrets CRDs exist
    - SkipDryRunOnMissingResource=true
    retry:
      limit: 5
      backoff:
        duration: 20s
        factor: 2
        maxDuration: 3m
