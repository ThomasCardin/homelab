apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: aws-credentials
  namespace: velero
  annotations:
    # Created before Velero starts
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault
    kind: ClusterSecretStore
  target:
    # Secret name expected by credentials.existingSecret in the Velero values
    name: aws-credentials
    creationPolicy: Owner
    template:
      data:
        # Velero reads the AWS credentials from a file in the `cloud` key
        cloud: |
          [default]
          aws_access_key_id={{ .access_key_id }}
          aws_secret_access_key={{ .secret_access_key }}
  data:
    - secretKey: access_key_id
      remoteRef:
        # Vault path: secret/velero/aws, field: access_key_id
        key: velero/aws
        property: access_key_id
    - secretKey: secret_access_key
      remoteRef:
        # Vault path: secret/velero/aws, field: secret_access_key
        key: velero/aws
        property: secret_access_key
