apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: cloudflare-api-token-secret
  namespace: cert-manager
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault
    kind: ClusterSecretStore
  target:
    # Secret name and key expected by the letsencrypt-prod ClusterIssuer
    name: cloudflare-api-token-secret
    creationPolicy: Owner
  data:
    - secretKey: api-token
      remoteRef:
        # Vault path: secret/cloudflare/cert-manager, field: api-token
        key: cloudflare/cert-manager
        property: api-token
