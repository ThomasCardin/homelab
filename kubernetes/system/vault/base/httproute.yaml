apiVersion: gateway.networking.k8s.io/v1beta1
kind: HTTPRoute
metadata:
  name: vault-route
spec:
  parentRefs:
    - name: default-gateway
      namespace: default
  hostnames:
    - vault.ninebasetwo.net
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: "/"
      backendRefs:
        - name: vault
          port: 8200
