apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: dex-secret
  namespace: argocd
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault
    kind: ClusterSecretStore
  target:
    # Referenced by dex.config as $dex-secret:dex.github.clientSecret
    name: dex-secret
    creationPolicy: Owner
    template:
      metadata:
        labels:
          # Required for Argo CD to read the secret
          app.kubernetes.io/part-of: argocd
  data:
    - secretKey: dex.github.clientSecret
      remoteRef:
        # Vault path: secret/argocd/dex, field: clientSecret
        key: argocd/dex
        property: clientSecret
